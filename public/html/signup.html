<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrieren | Liveserver Website</title>
    <link rel="stylesheet" href="../css/style.css?v=00.00.22">
    <script src="../js/api.js?v=00.00.22" defer></script>
    <script src="../js/signup.js" defer></script>
</head>
<body data-page="signup">
    <header class="site-header">
        <a class="brand" href="../../index.html" aria-label="Startseite">
            <span class="brand-mark" aria-hidden="true">LS</span>
            <img class="brand-logo" data-config-logo alt="">
            <span class="brand-text" data-config="schoolName">Liveserver Website</span>
        </a>
        <nav class="top-nav" aria-label="Hauptnavigation">
            <a href="../../index.html">Startseite</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="signup-heading">
            <div class="auth-copy">
                <p class="eyebrow">Registrierung</p>
                <h1 id="signup-heading">Neues Schülerkonto</h1>
                <p data-config="signupHint">Erstelle dein Konto mit Benutzername, Name und Passwort.</p>
            </div>

            <form class="form-stack" id="signup-form" novalidate>
                <div class="field-group">
                    <label for="realname">Name</label>
                    <input id="realname" name="realname" type="text" autocomplete="name" required maxlength="150">
                    <p class="field-error" id="realname-error" aria-live="polite"></p>
                </div>

                <div class="field-group">
                    <label for="username">Benutzername</label>
                    <input id="username" name="username" type="text" autocomplete="username" required maxlength="100">
                    <p class="field-hint">Erlaubt sind Buchstaben, Zahlen, Punkt, Unterstrich und Bindestrich.</p>
                    <p class="field-error" id="username-error" aria-live="polite"></p>
                </div>

                <div class="field-group">
                    <label for="password">Passwort</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
                    <p class="field-error" id="password-error" aria-live="polite"></p>
                </div>

                <div class="field-group">
                    <label for="password-confirm">Passwort wiederholen</label>
                    <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="8">
                    <p class="field-error" id="password-confirm-error" aria-live="polite"></p>
                </div>

                <button class="button primary full-width" type="submit" id="signup-submit">Registrieren</button>
                <p class="form-message" id="signup-message" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
