<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    <Directory /var/www/html>
        Require all granted
        Options -Indexes
        AllowOverride All
    </Directory>

    <Directory /var/www/html/database>
        Require all denied
    </Directory>

    <Directory /var/www/html/logs>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/liveserver_error.log
    CustomLog ${APACHE_LOG_DIR}/liveserver_access.log combined
</VirtualHost>
